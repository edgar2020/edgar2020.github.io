<script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.postcard-container');

      cards.forEach((card) => {
        // Random rotation between -5.0deg and +5.0deg
        const rot = (Math.random() * 5 - 2.5).toFixed(1);
        
        // Random offsets between -6px and +6px
        const x = (Math.random() * 12 - 6).toFixed(1);
        const y = (Math.random() * 12 - 6).toFixed(1);

        card.style.setProperty('--rot', `${rot}deg`);
        card.style.setProperty('--x', `${x}px`);
        card.style.setProperty('--y', `${y}px`);

        // Manage layer depth when flipping cards
        const toggle = card.querySelector('.postcard-toggle');
        if (toggle) {
          toggle.addEventListener('change', () => {
            cards.forEach(c => c.style.zIndex = '1');
            if (toggle.checked) {
              card.style.zIndex = '20';
            }
          });
        }
      });
    });
  </script>
