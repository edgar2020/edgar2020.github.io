<script>
  
/* =========================================================
   POSTCARD STACK
   ========================================================= */

const cards = Array.from(
  document.querySelectorAll(".postcard-container")
);

const nextButton = document.querySelector("#next-postcard");
const counter = document.querySelector("#postcard-counter");

let activeIndex = 0;
let isAnimating = false;


/* ---------------------------------------------------------
   STACK POSITIONS
   --------------------------------------------------------- */

const stackPositions = [
  { x: -22, y: -26 },
  { x: 20,  y: -17 },
  { x: -12, y: 13 },
  { x: 27,  y: 20 },
  { x: 0,   y: 4 }
];


/* ---------------------------------------------------------
   ANIMATION SETTINGS
   --------------------------------------------------------- */

const ARC_DURATION = 520;
const RETURN_DURATION = 560;

const ARC_X = 440;
const ARC_Y = 90;


/* ---------------------------------------------------------
   COUNTER
   --------------------------------------------------------- */

function updateCounter() {
  if (!counter) return;

  counter.textContent =
    `${activeIndex + 1} / ${cards.length}`;
}


/* ---------------------------------------------------------
   GET STACK POSITION
   --------------------------------------------------------- */

function getStackPosition(position) {
  return stackPositions[
    Math.min(position, stackPositions.length - 1)
  ];
}


/* ---------------------------------------------------------
   POSITION ALL CARDS
   --------------------------------------------------------- */

function positionCards(animate = true) {

  cards.forEach((card, index) => {

    const position =
      (index - activeIndex + cards.length) % cards.length;

    const stackPosition =
      getStackPosition(position);

    card.style.transition = animate
      ? `transform ${RETURN_DURATION}ms cubic-bezier(.22,.61,.36,1)`
      : "none";

    card.style.transform =
      `translate(${stackPosition.x}px, ${stackPosition.y}px)`;

    if (position === 0) {
      card.classList.add("is-active");
      card.style.zIndex = 100;
    } else {
      card.classList.remove("is-active");

      /*
         Cards closer to the front have higher z-index.
      */
      card.style.zIndex =
        cards.length - position;
    }
  });

  updateCounter();
}


/* ---------------------------------------------------------
   INITIALIZE
   --------------------------------------------------------- */

positionCards(false);


/* ---------------------------------------------------------
   ANIMATE CARD OUT OF THE STACK
   --------------------------------------------------------- */

function animateCardOut(card) {

  return new Promise((resolve) => {

    /*
       The card temporarily comes above the entire stack.
    */
    card.style.zIndex = 500;

    /*
       Start from wherever the card currently is.
       This is important when clicking a background card.
    */
    const computedTransform =
      getComputedStyle(card).transform;

    /*
       Force the browser to recognize the current position
       before starting the outward movement.
    */
    card.style.transition = "none";

    if (computedTransform !== "none") {
      card.style.transform = computedTransform;
    }

    void card.offsetWidth;


    /* -----------------------------------------------------
       OUTWARD ARC
       ----------------------------------------------------- */

    card.style.transition =
      `transform ${ARC_DURATION}ms cubic-bezier(.22,.61,.36,1)`;

    card.style.transform =
      `translate(${ARC_X}px, ${ARC_Y}px)
       rotate(8deg)
       scale(1.015)`;


    setTimeout(resolve, ARC_DURATION);
  });
}


/* ---------------------------------------------------------
   BRING A CARD TO THE FRONT
   --------------------------------------------------------- */

async function bringCardToFront(targetIndex) {

  if (isAnimating) return;

  if (
    targetIndex < 0 ||
    targetIndex >= cards.length
  ) {
    return;
  }

  /*
     Clicking the already-active card should not cycle the
     stack. Its normal label/checkbox behavior can handle
     the postcard flip.
  */
  if (targetIndex === activeIndex) return;

  isAnimating = true;

  const targetCard = cards[targetIndex];


  /* -------------------------------------------------------
     1. SEND SELECTED CARD OUTWARD
     ------------------------------------------------------- */

  await animateCardOut(targetCard);


  /* -------------------------------------------------------
     2. MAKE SELECTED CARD THE NEW ACTIVE CARD
     ------------------------------------------------------- */

  activeIndex = targetIndex;


  /*
     Put the selected card at the far side of the stack
     while it is still displaced to the right.
  */
  const bottomPosition =
    getStackPosition(
      Math.min(cards.length - 1, stackPositions.length - 1)
    );

  /*
     The card should now travel gracefully back toward the
     stack rather than snapping underneath it.
  */
  targetCard.style.transition =
    `transform ${RETURN_DURATION}ms cubic-bezier(.22,.61,.36,1)`;

  /*
     First bring the rest of the stack into their new
     positions. The selected card remains above them.
  */
  cards.forEach((card, index) => {

    if (card === targetCard) return;

    const position =
      (index - activeIndex + cards.length) % cards.length;

    const stackPosition =
      getStackPosition(position);

    card.style.transition =
      `transform ${RETURN_DURATION}ms cubic-bezier(.22,.61,.36,1)`;

    card.style.transform =
      `translate(${stackPosition.x}px, ${stackPosition.y}px)`;

    card.classList.toggle(
      "is-active",
      position === 0
    );

    card.style.zIndex =
      position === 0
        ? 100
        : cards.length - position;
  });


  /*
     The selected card travels from the right-hand arc
     back into the FRONT of the stack.

     This is deliberately the same general speed as the
     outward movement, rather than instantly appearing
     underneath the cards.
  */
  requestAnimationFrame(() => {

    targetCard.style.transform =
      `translate(${stackPositions[0].x}px,
                 ${stackPositions[0].y}px)
       rotate(0deg)
       scale(1)`;
  });


  updateCounter();


  /* -------------------------------------------------------
     3. WAIT FOR THE RETURN MOTION
     ------------------------------------------------------- */

  setTimeout(() => {

    targetCard.style.zIndex = 100;
    targetCard.classList.add("is-active");

    /*
       Clean up inline transitions so future animations
       can control them.
    */
    cards.forEach((card) => {
      card.style.transition = "";
    });

    isAnimating = false;

  }, RETURN_DURATION + 40);
}


/* ---------------------------------------------------------
   NEXT POSTCARD
   --------------------------------------------------------- */

function nextPostcard() {

  if (isAnimating || cards.length < 2) {
    return;
  }

  const nextIndex =
    (activeIndex + 1) % cards.length;

  bringCardToFront(nextIndex);
}


/* ---------------------------------------------------------
   NEXT BUTTON
   --------------------------------------------------------- */

if (nextButton) {
  nextButton.addEventListener(
    "click",
    nextPostcard
  );
}


/* ---------------------------------------------------------
   CLICKING BACKGROUND POSTCARDS
   --------------------------------------------------------- */

/*
   Clicking a background postcard brings THAT postcard to
   the front using the same physical animation as the
   Next button.

   The active postcard is ignored here so clicking its
   label still performs the normal front/back flip.
 */
cards.forEach((card, index) => {

  card.addEventListener("click", (event) => {

    /*
       If this is already the active card, don't interfere
       with its checkbox/label flip interaction.
    */
    if (index === activeIndex) {
      return;
    }

    /*
       Background card was clicked.
       Stop the normal label click from toggling its flip
       checkbox, because this click is being used to bring
       the card forward.
    */
    event.preventDefault();
    event.stopPropagation();

    bringCardToFront(index);
  });
});


/* ---------------------------------------------------------
   KEYBOARD NAVIGATION
   --------------------------------------------------------- */

document.addEventListener("keydown", (event) => {

  const activeElement = document.activeElement;

  /*
     Don't hijack arrow keys while typing.
  */
  if (
    activeElement &&
    (
      activeElement.tagName === "INPUT" ||
      activeElement.tagName === "TEXTAREA" ||
      activeElement.isContentEditable
    )
  ) {
    return;
  }


  if (
    event.key === "ArrowRight" ||
    event.key === "ArrowDown"
  ) {
    event.preventDefault();

    nextPostcard();
  }

});

</script>
